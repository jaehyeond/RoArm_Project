<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650">
  <style>
    .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
    .sub { font: 15px Arial, sans-serif; fill: #334155; }
    .label { font: 14px Arial, sans-serif; fill: #0f172a; }
    .tick { font: 12px Arial, sans-serif; fill: #475569; }
    .small { font: 12px Arial, sans-serif; fill: #334155; }
    .warn { font: 700 14px Arial, sans-serif; fill: #991b1b; }
    .ok { font: 700 14px Arial, sans-serif; fill: #166534; }
  </style>
  <rect x="0" y="0" width="1180" height="650" fill="#f8fafc"/>
  <text x="58" y="52" class="title">10cm tap direct-IK-apply contact-frame audit</text>
  <text x="58" y="82" class="sub">Reconstructed from direct runtime scalar + trace aggregates; no new GPU runtime in this audit.</text>

  <rect x="295.1" y="244" width="130.1" height="172" fill="#bbf7d0" opacity="0.72" stroke="#16a34a" stroke-width="2"/>
  <text x="360.1" y="228" text-anchor="middle" class="ok">contact band: face_gap [-10,+10] mm</text>
  <rect x="360.1" y="272" width="650.3" height="116" rx="4" fill="#d9f99d" stroke="#3f6212" stroke-width="2"/>
  <text x="685.3" y="335" text-anchor="middle" class="label">10cm cube</text>
  <line x1="360.1" y1="226" x2="360.1" y2="434" stroke="#0f172a" stroke-width="2.5"/>
  <text x="360.1" y="462" text-anchor="middle" class="label">live approach face</text>

  <line x1="100" y1="416" x2="1108" y2="416" stroke="#94a3b8"/>
  <line x1="165.0" y1="410" x2="165.0" y2="422" stroke="#64748b"/><text x="165.0" y="442" text-anchor="middle" class="tick">-80</text><line x1="230.1" y1="410" x2="230.1" y2="422" stroke="#64748b"/><text x="230.1" y="442" text-anchor="middle" class="tick">-70</text><line x1="295.1" y1="410" x2="295.1" y2="422" stroke="#64748b"/><text x="295.1" y="442" text-anchor="middle" class="tick">-60</text><line x1="360.1" y1="410" x2="360.1" y2="422" stroke="#64748b"/><text x="360.1" y="442" text-anchor="middle" class="tick">-50</text><line x1="425.2" y1="410" x2="425.2" y2="422" stroke="#64748b"/><text x="425.2" y="442" text-anchor="middle" class="tick">-40</text><line x1="490.2" y1="410" x2="490.2" y2="422" stroke="#64748b"/><text x="490.2" y="442" text-anchor="middle" class="tick">-30</text><line x1="555.2" y1="410" x2="555.2" y2="422" stroke="#64748b"/><text x="555.2" y="442" text-anchor="middle" class="tick">-20</text><line x1="620.3" y1="410" x2="620.3" y2="422" stroke="#64748b"/><text x="620.3" y="442" text-anchor="middle" class="tick">-10</text><line x1="685.3" y1="410" x2="685.3" y2="422" stroke="#64748b"/><text x="685.3" y="442" text-anchor="middle" class="tick">0</text><line x1="750.3" y1="410" x2="750.3" y2="422" stroke="#64748b"/><text x="750.3" y="442" text-anchor="middle" class="tick">10</text><line x1="815.4" y1="410" x2="815.4" y2="422" stroke="#64748b"/><text x="815.4" y="442" text-anchor="middle" class="tick">20</text><line x1="880.4" y1="410" x2="880.4" y2="422" stroke="#64748b"/><text x="880.4" y="442" text-anchor="middle" class="tick">30</text><line x1="945.4" y1="410" x2="945.4" y2="422" stroke="#64748b"/><text x="945.4" y="442" text-anchor="middle" class="tick">40</text><line x1="1010.5" y1="410" x2="1010.5" y2="422" stroke="#64748b"/><text x="1010.5" y="442" text-anchor="middle" class="tick">50</text>
  <text x="1122" y="442" text-anchor="end" class="tick">along position vs cube center (mm)</text>

  <line x1="228.4" y1="272" x2="228.4" y2="388" stroke="#2563eb" stroke-width="4"/>
  <text x="228.4" y="212" text-anchor="middle" class="small">initial gap -20.252 mm</text>
  <circle cx="228.4" cy="248" r="7" fill="#2563eb"/>

  <line x1="233.1" y1="258" x2="233.1" y2="402" stroke="#7c3aed" stroke-width="4"/>
  <text x="233.1" y="160" text-anchor="middle" class="warn">best still outside</text>
  <text x="233.1" y="182" text-anchor="middle" class="small">face_gap -19.534 mm</text>
  <circle cx="233.1" cy="226" r="7" fill="#7c3aed"/>

  <line x1="232.9" y1="272" x2="232.9" y2="388" stroke="#dc2626" stroke-width="4"/>
  <text x="232.9" y="114" text-anchor="middle" class="warn">final outside band</text>
  <text x="232.9" y="136" text-anchor="middle" class="small">face_gap -19.565 mm</text>
  <circle cx="232.9" cy="202" r="7" fill="#dc2626"/>

  <line x1="233.1" y1="196" x2="295.1" y2="196" stroke="#991b1b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="264.1" y="186" text-anchor="middle" class="warn">best shortfall 9.534 mm</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#991b1b"/>
    </marker>
  </defs>

  <rect x="60" y="462" width="1058" height="130" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="86" y="496" class="label">Diagnosis</text>
  <text x="86" y="526" class="sub">direct apply active = True; RL action path bypassed = True; contact = 0.0</text>
  <text x="86" y="554" class="sub">lateral_ok = True (0.005 mm); vertical_ok = True (4.597 mm); face_gap_near_band = False</text>
  <text x="86" y="582" class="warn">Verdict: professor physical reaction evidence is separate from RL contact-gated readiness.</text>
</svg>
