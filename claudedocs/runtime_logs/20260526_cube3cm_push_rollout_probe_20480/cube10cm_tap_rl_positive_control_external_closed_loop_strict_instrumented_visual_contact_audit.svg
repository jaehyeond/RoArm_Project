<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610">
  <style>
    .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
    .sub { font: 15px Arial, sans-serif; fill: #334155; }
    .label { font: 14px Arial, sans-serif; fill: #0f172a; }
    .tick { font: 12px Arial, sans-serif; fill: #475569; }
    .small { font: 12px Arial, sans-serif; fill: #334155; }
    .warn { font: 700 14px Arial, sans-serif; fill: #991b1b; }
    .ok { font: 700 14px Arial, sans-serif; fill: #166534; }
  </style>
  <rect x="0" y="0" width="1120" height="610" fill="#f8fafc"/>
  <text x="56" y="52" class="title">10cm tap positive-control contact-frame audit</text>
  <text x="56" y="82" class="sub">Reconstructed from existing reset/final logs only; no per-step trace and no new GPU runtime.</text>

  <rect x="342.2" y="257" width="615.5" height="116" rx="4" fill="#d9f99d" stroke="#3f6212" stroke-width="2"/>
  <text x="649.9" y="320" text-anchor="middle" class="label">10cm cube</text>

  <rect x="280.6" y="233" width="123.1" height="164" fill="#bbf7d0" opacity="0.74" stroke="#16a34a" stroke-width="2"/>
  <text x="342.2" y="219" text-anchor="middle" class="ok">contact band: face_gap [-10,+10] mm</text>

  <line x1="342.2" y1="215" x2="342.2" y2="415" stroke="#0f172a" stroke-width="2.5"/>
  <text x="342.2" y="439" text-anchor="middle" class="label">live approach face</text>

  <line x1="96" y1="393" x2="1050" y2="393" stroke="#94a3b8"/>
  <line x1="157.5" y1="387" x2="157.5" y2="399" stroke="#64748b"/><text x="157.5" y="419" text-anchor="middle" class="tick">-80</text><line x1="219.1" y1="387" x2="219.1" y2="399" stroke="#64748b"/><text x="219.1" y="419" text-anchor="middle" class="tick">-70</text><line x1="280.6" y1="387" x2="280.6" y2="399" stroke="#64748b"/><text x="280.6" y="419" text-anchor="middle" class="tick">-60</text><line x1="342.2" y1="387" x2="342.2" y2="399" stroke="#64748b"/><text x="342.2" y="419" text-anchor="middle" class="tick">-50</text><line x1="403.7" y1="387" x2="403.7" y2="399" stroke="#64748b"/><text x="403.7" y="419" text-anchor="middle" class="tick">-40</text><line x1="465.3" y1="387" x2="465.3" y2="399" stroke="#64748b"/><text x="465.3" y="419" text-anchor="middle" class="tick">-30</text><line x1="526.8" y1="387" x2="526.8" y2="399" stroke="#64748b"/><text x="526.8" y="419" text-anchor="middle" class="tick">-20</text><line x1="588.4" y1="387" x2="588.4" y2="399" stroke="#64748b"/><text x="588.4" y="419" text-anchor="middle" class="tick">-10</text><line x1="649.9" y1="387" x2="649.9" y2="399" stroke="#64748b"/><text x="649.9" y="419" text-anchor="middle" class="tick">0</text><line x1="711.5" y1="387" x2="711.5" y2="399" stroke="#64748b"/><text x="711.5" y="419" text-anchor="middle" class="tick">10</text><line x1="773.0" y1="387" x2="773.0" y2="399" stroke="#64748b"/><text x="773.0" y="419" text-anchor="middle" class="tick">20</text><line x1="834.6" y1="387" x2="834.6" y2="399" stroke="#64748b"/><text x="834.6" y="419" text-anchor="middle" class="tick">30</text><line x1="896.1" y1="387" x2="896.1" y2="399" stroke="#64748b"/><text x="896.1" y="419" text-anchor="middle" class="tick">40</text><line x1="957.7" y1="387" x2="957.7" y2="399" stroke="#64748b"/><text x="957.7" y="419" text-anchor="middle" class="tick">50</text>
  <text x="1064" y="419" text-anchor="end" class="tick">along position vs cube center (mm)</text>

  <line x1="217.5" y1="257" x2="217.5" y2="373" stroke="#2563eb" stroke-width="4"/>
  <circle cx="217.5" cy="243" r="8" fill="#2563eb"/>
  <text x="217.5" y="223" text-anchor="middle" class="label">initial TCP</text>
  <text x="217.5" y="203" text-anchor="middle" class="small">face_gap -20.252 mm</text>

  <line x1="215.9" y1="257" x2="215.9" y2="373" stroke="#dc2626" stroke-width="4"/>
  <circle cx="215.9" cy="169" r="8" fill="#dc2626"/>
  <text x="215.9" y="147" text-anchor="middle" class="warn">final TCP outside band</text>
  <text x="215.9" y="127" text-anchor="middle" class="small">face_gap -20.518 mm</text>

  <line x1="215.9" y1="195" x2="280.6" y2="195" stroke="#991b1b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="248.3" y="185" text-anchor="middle" class="warn">shortfall 10.518 mm</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#991b1b"/>
    </marker>
  </defs>

  <rect x="58" y="430" width="1004" height="126" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="84" y="462" class="label">Axis diagnosis</text>
  <text x="84" y="492" class="sub">along gap blocker = True; lateral_ok = True (final 0.002 mm); vertical_ok = True (final 0.354 mm)</text>
  <text x="84" y="522" class="sub">gap_delta = -0.266 mm, cube_disp_along = 0.824 mm, raw reaction without contact context = True</text>
  <text x="84" y="548" class="warn">Verdict: contact stayed 0 because the controller did not close the live face gap; this is not a lateral or height failure.</text>
</svg>
